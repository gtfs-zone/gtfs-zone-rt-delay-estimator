services:
  bridge:
    build: .
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_BROKER: tcp://host.docker.internal:1883
      REDIS_URL: redis://host.docker.internal:6379/1
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/postgres
