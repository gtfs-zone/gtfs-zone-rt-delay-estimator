services:
  bridge:
    build: .
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_BROKER: tcp://host.docker.internal:1883
      REDIS_URL: redis://host.docker.internal:6379/1
      GTFS_FEED_URLS_ENDPOINT: http://host.docker.internal:8000/feed_urls
